    const comprimirImagenBase64 = (file, maxWidth = 380, quality = 0.7) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve('');
          img.src = event.target.result;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    };

    const guardarEnStorage = (clave, valor) => {
      const json = JSON.stringify(valor);
      let ok = false;
      try {
        localStorage.setItem(clave, json);
        ok = true;
      } catch (e) {}

      try {
        const mem = window.name && window.name.startsWith('{') ? JSON.parse(window.name) : {};
        mem[clave] = valor;
        window.name = JSON.stringify(mem);
      } catch (e) {}

      return ok;
    };

    const leerDeStorage = (clave, defecto) => {
      try {
        const item = localStorage.getItem(clave);
        if (item !== null) return JSON.parse(item);
      } catch (e) {}

      try {
        if (window.name && window.name.startsWith('{')) {
          const mem = JSON.parse(window.name);
          if (mem[clave] !== undefined) return mem[clave];
        }
      } catch (e) {}

      return defecto;
    };

      const calcularMontoMapa = (itemsObj) => {
        return Object.entries(itemsObj || {}).reduce((total, [key, cant]) => {
          const [prodId, masa] = key.split('|');
          const prod = listaMenuSegura.find(m => m.id === prodId);
          if (!prod) return total;
          const precio = prod.esPupusa ? (masa === 'arroz' ? prod.precioArroz : prod.precioMaiz) : prod.precio;
          return total + (precio * cant);
        }, 0);
      };

      const generarTextoUnificadoPlancha = (subcuentasObj) => {
        const combinado = {};
        Object.values(subcuentasObj || {}).forEach(subMap => {
          Object.entries(subMap || {}).forEach(([key, cant]) => {
            combinado[key] = (combinado[key] || 0) + cant;
          });
        });

        return Object.entries(combinado).map(([key, cant]) => {
          const [prodId, masa] = key.split('|');
          const prod = listaMenuSegura.find(m => m.id === prodId);
          if (!prod) return '';
          const detalleMasa = prod.esPupusa ? (masa === 'arroz' ? 'Arroz' : 'Maíz') : '';
          return `${cant}x ${prod.nombre}${detalleMasa ? ` (${detalleMasa})` : ''}`;
        }).filter(Boolean).join(', ');
      };

      const ajustarCantidad = (itemKey, cambio, comensalObjetivo = comensalActivo) => {
        setItemsByComensal(prev => {
          const subActual = prev[comensalObjetivo] || {};
          const actual = subActual[itemKey] || 0;
          const nuevo = actual + cambio;
          const copiaSub = { ...subActual };
          if (nuevo <= 0) {
            delete copiaSub[itemKey];
          } else {
            copiaSub[itemKey] = nuevo;
          }
          return { ...prev, [comensalObjetivo]: copiaSub };
        });
      };

      const agregarComensal = (nombrePersonalizado) => {
        const nombreLimpio = (nombrePersonalizado || nuevoComensalInput).trim() || `Amigo ${comensalesList.length + 1}`;
        if (!comensalesList.includes(nombreLimpio)) {
          setComensalesList(prev => [...prev, nombreLimpio]);
          setItemsByComensal(prev => ({ ...prev, [nombreLimpio]: prev[nombreLimpio] || {} }));
        }
        setComensalActivo(nombreLimpio);
        setNuevoComensalInput('');
        setMostrandoInputComensal(false);
      };

      const totalOrden = Object.values(itemsByComensal).reduce((acc, subMap) => acc + calcularMontoMapa(subMap), 0);
      const ordenActualComensal = itemsByComensal[comensalActivo] || {};

      const iniciarNuevaOrden = () => {
        setOrdenActivaEditandoId(null);
        setComensalesList(['General']);
        setComensalActivo('General');
        setItemsByComensal({ General: {} });
        setNombreCliente('');
        setTelefonoCliente('');
        setDireccionCliente('');
        setEstadoPagoInicial('pendiente');
        setVista('pos');
        setModalServicio(true);
      };

      const confirmarModalidadYCliente = () => {
        const nombreCli = nombreCliente.trim();
        if (nombreCli && comensalesList.length === 1 && comensalesList[0] === 'General') {
          const itemsGen = itemsByComensal['General'] || {};
          setComensalesList([nombreCli]);
          setComensalActivo(nombreCli);
          setItemsByComensal({ [nombreCli]: itemsGen });
        }
        setModalServicio(false);
      };

      const iniciarEdicionOrdenActiva = (orden) => {
        setOrdenActivaEditandoId(orden.id);
        if (orden.subcuentas && Object.keys(orden.subcuentas).length > 0) {
          const listaNombres = Object.keys(orden.subcuentas);
          const mapaItems = {};
          listaNombres.forEach(nom => {
            mapaItems[nom] = { ...(orden.subcuentas[nom].itemsMap || {}) };
          });
          setComensalesList(listaNombres);
          setComensalActivo(listaNombres[0]);
          setItemsByComensal(mapaItems);
        } else {
          const nom = orden.clienteNombre || 'General';
          setComensalesList([nom]);
          setComensalActivo(nom);
          setItemsByComensal({ [nom]: orden.itemsMap ? { ...orden.itemsMap } : {} });
        }

        setTipoServicio(orden.tipoServicio || 'mesa');
        if (orden.mesaSeleccionada) setMesaSeleccionada(orden.mesaSeleccionada);
        setNombreCliente(orden.clienteNombre || '');
        setTelefonoCliente(orden.clienteTel || '');
        setDireccionCliente(orden.clienteDir || '');
        setVista('pos');
      };

      const cancelarEdicionOrdenActiva = () => {
        setOrdenActivaEditandoId(null);
        setComensalesList(['General']);
        setComensalActivo('General');
        setItemsByComensal({ General: {} });
        setVista('activas');
      };

      const guardarEdicionOrdenActiva = () => {
        if (!ordenEditando || totalOrden <= 0) return;

        const nuevoDetalle = generarTextoUnificadoPlancha(itemsByComensal);
        const sufijoCliente = nombreCliente.trim() ? ` (${nombreCliente.trim()})` : '';
        let nuevoDestino = '';
        if (tipoServicio === 'mesa') nuevoDestino = (mesaSeleccionada === 'barra' ? 'Barra' : `Mesa #${mesaSeleccionada}`) + sufijoCliente;
        else if (tipoServicio === 'llevar') nuevoDestino = `Llevar: ${nombreCliente.trim() || 'Mostrador'}`;
        else nuevoDestino = `Delivery: ${nombreCliente.trim() || 'Cliente'}${direccionCliente ? ` (${direccionCliente})` : ''}`;

        setOrdenesActivas(prev => prev.map(o => {
          if (o.id !== ordenEditando.id) return o;

          const subcuentasActualizadas = {};
          let totalPagadoAcumulado = 0;

          Object.entries(itemsByComensal).forEach(([nomComensal, subMap]) => {
            const montoSub = calcularMontoMapa(subMap);
            if (montoSub <= 0 && !o.subcuentas?.[nomComensal]?.pagada) return;
            const previa = o.subcuentas?.[nomComensal];
            const estabaPagada = previa?.pagada && Math.abs((previa?.monto || 0) - montoSub) < 0.01;
            if (estabaPagada) totalPagadoAcumulado += montoSub;

            subcuentasActualizadas[nomComensal] = {
              itemsMap: { ...subMap },
              monto: montoSub,
              pagada: Boolean(estabaPagada),
              metodoPago: estabaPagada ? previa.metodoPago : null
            };
          });

          const saldoRestante = Math.max(0, totalOrden - totalPagadoAcumulado);

          return {
            ...o,
            tipoServicio,
            mesaSeleccionada,
            destino: nuevoDestino,
            clienteNombre: nombreCliente.trim(),
            clienteTel: telefonoCliente.trim(),
            clienteDir: direccionCliente.trim(),
            subcuentas: subcuentasActualizadas,
            detalle: nuevoDetalle,
            monto: totalOrden,
            montoPagado: totalPagadoAcumulado,
            saldoPendiente: saldoRestante,
            pagada: saldoRestante <= 0.01
          };
        }));

        setOrdenActivaEditandoId(null);
        setVista('activas');
      };

      const eliminarOrdenActiva = (orden) => {
        const msg = orden.montoPagado > 0
          ? `¿Eliminar la Orden ${formatearNumeroOrden(orden.numero)} (${orden.destino})? Se revertirá el cobro de $${orden.montoPagado.toFixed(2)} registrado.`
          : `¿Eliminar la Orden ${formatearNumeroOrden(orden.numero)} (${orden.destino})?`;

        if (!window.confirm(msg)) return;
        if (orden.transaccionId) {
          setTransacciones(prev => prev.filter(t => t.id !== orden.transaccionId));
        }
        setOrdenesActivas(prev => prev.filter(o => o.id !== orden.id));
      };

      const actualizarDirectorioCliente = (nombre, tel, dir, montoCompra, esFiado, detallePedido, fecha, hora) => {
        if (!nombre.trim()) return;
        const nombreNorm = nombre.trim();
        setClientes(prev => {
          const idx = prev.findIndex(c => c.nombre.toLowerCase() === nombreNorm.toLowerCase());
          if (idx >= 0) {
            const copia = [...prev];
            const existente = copia[idx];
            copia[idx] = {
              ...existente,
              telefono: tel.trim() || existente.telefono,
              direccion: dir.trim() || existente.direccion,
              comprasCount: existente.comprasCount + 1,
              saldoFiado: esFiado ? existente.saldoFiado + montoCompra : existente.saldoFiado,
              historialFiados: esFiado
                ? [{ fecha, hora, monto: montoCompra, detalle: detallePedido }, ...existente.historialFiados]
                : existente.historialFiados
            };
            return copia;
          } else {
            return [{
              id: Date.now(),
              nombre: nombreNorm,
              telefono: tel.trim(),
              direccion: dir.trim(),
              comprasCount: 1,
              saldoFiado: esFiado ? montoCompra : 0,
              historialFiados: esFiado ? [{ fecha, hora, monto: montoCompra, detalle: detallePedido }] : []
            }, ...prev];
          }
        });
      };

      const crearOrdenActiva = () => {
        if (totalOrden <= 0) return;
        const ahora = new Date();
        const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const fechaStr = ahora.toLocaleDateString('es-SV');
        const numOrdenActual = contadorOrden;

        const sufijoCliente = nombreCliente.trim() ? ` (${nombreCliente.trim()})` : '';
        let destino = '';
        if (tipoServicio === 'mesa') destino = (mesaSeleccionada === 'barra' ? 'Barra' : `Mesa #${mesaSeleccionada}`) + sufijoCliente;
        else if (tipoServicio === 'llevar') destino = `Llevar: ${nombreCliente.trim() || 'Mostrador'}`;
        else destino = `Delivery: ${nombreCliente.trim() || 'Cliente'}${direccionCliente ? ` (${direccionCliente})` : ''}`;

        const itemsTexto = generarTextoUnificadoPlancha(itemsByComensal);
        const yaPagado = estadoPagoInicial === 'pagado';
        const esFiado = yaPagado && metodoPago === 'fiado';
        let txId = null;

        const subcuentasObj = {};
        Object.entries(itemsByComensal).forEach(([nomComensal, subMap]) => {
          const montoSub = calcularMontoMapa(subMap);
          if (montoSub > 0) {
            subcuentasObj[nomComensal] = {
              itemsMap: { ...subMap },
              monto: montoSub,
              pagada: yaPagado,
              metodoPago: yaPagado ? metodoPago : null
            };
          }
        });

        if (yaPagado) {
          if (esFiado) {
            actualizarDirectorioCliente(nombreCliente || 'Cliente sin nombre', telefonoCliente, direccionCliente, totalOrden, true, itemsTexto, fechaStr, horaStr);
          } else {
            txId = Date.now();
            setTransacciones(prev => [{
              id: txId,
              numeroOrden: numOrdenActual,
              tipoServicio,
              timestamp: ahora.getTime(),
              monto: totalOrden,
              metodo: metodoPago,
              destino,
              detalle: itemsTexto,
              hora: horaStr,
              fecha: fechaStr
            }, ...prev]);
            if (nombreCliente.trim()) {
              actualizarDirectorioCliente(nombreCliente, telefonoCliente, direccionCliente, totalOrden, false, itemsTexto, fechaStr, horaStr);
            }
          }
        }

        const nuevaActiva = {
          id: Date.now() + 1,
          numero: numOrdenActual,
          transaccionId: txId,
          timestamp: ahora.getTime(),
          hora: horaStr,
          fecha: fechaStr,
          tipoServicio,
          mesaSeleccionada,
          destino,
          clienteNombre: nombreCliente.trim(),
          clienteTel: telefonoCliente.trim(),
          clienteDir: direccionCliente.trim(),
          subcuentas: subcuentasObj,
          detalle: itemsTexto,
          monto: totalOrden,
          montoPagado: yaPagado ? totalOrden : 0,
          saldoPendiente: yaPagado ? 0 : totalOrden,
          pagada: yaPagado,
          metodoPago: yaPagado ? metodoPago : null
        };

        setOrdenesActivas(prev => [nuevaActiva, ...prev]);
        setContadorOrden(prev => prev + 1);
        setComensalesList(['General']);
        setComensalActivo('General');
        setItemsByComensal({ General: {} });
        setEstadoPagoInicial('pendiente');
        setModalComanda(false);
        setVista('activas');
      };

      const abrirModalCobroOrden = (orden) => {
        const subKeys = Object.keys(orden.subcuentas || {});
        const pendientes = subKeys.filter(k => !orden.subcuentas[k].pagada);
        setModalCobrarActiva(orden);
        setModoCobroActiva(pendientes.length > 1 ? 'comensales' : 'todo');
        setComensalesSeleccionadosCobro(pendientes);
      };

      const cobrarOrdenActiva = (orden, metodoElegido, soloSeleccionados = false) => {
        const ahora = new Date();
        const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const fechaStr = ahora.toLocaleDateString('es-SV');

        let montoACobrar = 0;
        let etiquetaCobro = '';
        const nuevasSubcuentas = { ...(orden.subcuentas || {}) };

        if (soloSeleccionados && comensalesSeleccionadosCobro.length > 0) {
          comensalesSeleccionadosCobro.forEach(nom => {
            if (nuevasSubcuentas[nom] && !nuevasSubcuentas[nom].pagada) {
              montoACobrar += nuevasSubcuentas[nom].monto;
              nuevasSubcuentas[nom] = {
                ...nuevasSubcuentas[nom],
                pagada: true,
                metodoPago: metodoElegido
              };
            }
          });
          etiquetaCobro = `Subcuenta (${comensalesSeleccionadosCobro.join(' + ')}) - ${orden.destino}`;
        } else {
          montoACobrar = orden.saldoPendiente > 0 ? orden.saldoPendiente : orden.monto;
          Object.keys(nuevasSubcuentas).forEach(nom => {
            if (!nuevasSubcuentas[nom].pagada) {
              nuevasSubcuentas[nom] = { ...nuevasSubcuentas[nom], pagada: true, metodoPago: metodoElegido };
            }
          });
          etiquetaCobro = orden.destino;
        }

        if (montoACobrar <= 0) return;

        let txId = orden.transaccionId || null;

        if (metodoElegido === 'fiado') {
          const nombreDeudor = (soloSeleccionados && comensalesSeleccionadosCobro.length === 1)
            ? comensalesSeleccionadosCobro[0]
            : (orden.clienteNombre || comensalesSeleccionadosCobro.join(', ') || 'Cliente sin nombre');
          actualizarDirectorioCliente(nombreDeudor, orden.clienteTel, orden.clienteDir, montoACobrar, true, etiquetaCobro, fechaStr, horaStr);
        } else {
          txId = Date.now();
          setTransacciones(prev => [{
            id: txId,
            numeroOrden: orden.numero,
            tipoServicio: orden.tipoServicio || 'mesa',
            timestamp: ahora.getTime(),
            monto: montoACobrar,
            metodo: metodoElegido,
            destino: etiquetaCobro,
            detalle: orden.detalle,
            hora: horaStr,
            fecha: fechaStr
          }, ...prev]);
          if (orden.clienteNombre) {
            actualizarDirectorioCliente(orden.clienteNombre, orden.clienteTel, orden.clienteDir, montoACobrar, false, orden.detalle, fechaStr, horaStr);
          }
        }

        const nuevoPagadoTotal = (orden.montoPagado || 0) + montoACobrar;
        const nuevoSaldoPendiente = Math.max(0, orden.monto - nuevoPagadoTotal);
        const quedoTotalmentePagada = nuevoSaldoPendiente <= 0.01;

        setOrdenesActivas(prev => prev.map(o => o.id === orden.id ? {
          ...o,
          transaccionId: txId,
          subcuentas: nuevasSubcuentas,
          pagada: quedoTotalmentePagada,
          montoPagado: nuevoPagadoTotal,
          saldoPendiente: nuevoSaldoPendiente,
          metodoPago: quedoTotalmentePagada ? metodoElegido : 'parcial'
        } : o));

        setModalCobrarActiva(null);
      };

      const marcarComoEntregada = (orden) => {
        if (!orden.pagada) {
          abrirModalCobroOrden(orden);
          return;
        }
        setOrdenesCompletadasHoy(prev => [{
          id: orden.id,
          numero: orden.numero,
          timestamp: Date.now(),
          destino: orden.destino,
          monto: orden.monto
        }, ...prev]);
        setOrdenesActivas(prev => prev.filter(o => o.id !== orden.id));
      };

      const saldarDeudaCliente = (clienteId, metodoCobro) => {
        const cli = clientes.find(c => c.id === clienteId);
        if (!cli || cli.saldoFiado <= 0) return;

        const ahora = new Date();
        setTransacciones(prev => [{
          id: Date.now(),
          tipoServicio: 'abono_fiado',
          timestamp: ahora.getTime(),
          monto: cli.saldoFiado,
          metodo: metodoCobro,
          destino: `Abono Fiado: ${cli.nombre}`,
          detalle: `Liquidación de cuenta acumulada`,
          hora: ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          fecha: ahora.toLocaleDateString('es-SV')
        }, ...prev]);

        setClientes(prev => prev.map(c => c.id === clienteId ? { ...c, saldoFiado: 0, historialFiados: [] } : c));
      };

      const guardarGasto = () => {
        const val = parseFloat(montoGasto);
        if (!val || val <= 0) return;
        const cat = GASTOS_CATEGORIAS.find(c => c.id === catGasto);

        if (gastoEditandoId) {
          setGastos(prev => prev.map(g => g.id === gastoEditandoId ? {
            ...g,
            monto: val,
            categoriaId: cat.id,
            categoria: cat.label,
            icono: cat.icon
          } : g));
          setGastoEditandoId(null);
        } else {
          const ahora = new Date();
          setGastos(prev => [{
            id: Date.now(),
            timestamp: ahora.getTime(),
            monto: val,
            categoriaId: cat.id,
            categoria: cat.label,
            icono: cat.icon,
            hora: ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            fecha: ahora.toLocaleDateString('es-SV')
          }, ...prev]);
        }
        setMontoGasto('');
      };

      const iniciarEdicionGasto = (g) => {
        setGastoEditandoId(g.id);
        setMontoGasto(g.monto.toString());
        setCatGasto(g.categoriaId || GASTOS_CATEGORIAS[0].id);
      };

      const cancelarEdicionGasto = () => {
        setGastoEditandoId(null);
        setMontoGasto('');
      };

      const eliminarGasto = (idGasto) => {
        if (!window.confirm('¿Eliminar este gasto registrado?')) return;
        setGastos(prev => prev.filter(g => g.id !== idGasto));
        if (gastoEditandoId === idGasto) cancelarEdicionGasto();
      };

      const filtrarPorPeriodo = (lista) => {
        const ahora = new Date();
        const inicioHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).getTime();
        const hace7Dias = inicioHoy - (6 * 24 * 60 * 60 * 1000);
        const inicioMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).getTime();

        return lista.filter(item => {
          const ts = item.timestamp || item.id;
          if (periodoResumen === 'hoy') return ts >= inicioHoy;
          if (periodoResumen === 'semana') return ts >= hace7Dias;
          if (periodoResumen === 'mes') return ts >= inicioMes;
          return true;
        });
      };

      const ventasFiltradas = filtrarPorPeriodo(transacciones);
      const gastosFiltrados = filtrarPorPeriodo(gastos);

      const inicioHoyTs = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();
      const completadasCicloActual = ordenesCompletadasHoy.filter(c => (c.timestamp || 0) >= inicioHoyTs).length;

      const ordenesPeriodo = ventasFiltradas.filter(t => t.tipoServicio !== 'abono_fiado');
      const totalOrdenesCount = ordenesPeriodo.length;
      const ordenesMesaCount = ordenesPeriodo.filter(t => t.tipoServicio === 'mesa' || (!t.tipoServicio && t.destino?.startsWith('Mesa')) || (!t.tipoServicio && t.destino === 'Barra')).length;
      const ordenesLlevarCount = ordenesPeriodo.filter(t => t.tipoServicio === 'llevar' || (!t.tipoServicio && t.destino?.startsWith('Llevar'))).length;
      const ordenesDeliveryCount = ordenesPeriodo.filter(t => t.tipoServicio === 'delivery' || (!t.tipoServicio && t.destino?.startsWith('Delivery'))).length;
      const ticketPromedio = totalOrdenesCount > 0 ? (ventasFiltradas.reduce((a, b) => a + b.monto, 0) / totalOrdenesCount) : 0;

      const sumVentas = ventasFiltradas.reduce((a, b) => a + b.monto, 0);
      const sumGastos = gastosFiltrados.reduce((a, b) => a + b.monto, 0);
      const gananciaNeta = sumVentas - sumGastos;

      const sumEfectivo = ventasFiltradas.filter(t => t.metodo === 'efectivo').reduce((a, b) => a + b.monto, 0);
      const sumWompi = ventasFiltradas.filter(t => t.metodo === 'wompi').reduce((a, b) => a + b.monto, 0);
      const sumTransf = ventasFiltradas.filter(t => t.metodo === 'transferencia').reduce((a, b) => a + b.monto, 0);

      const efectivoFisicoTotal = (periodoResumen === 'hoy' ? (Number(config.fondoInicial) || 0) : 0) + sumEfectivo - sumGastos;

      const desgloseGastos = GASTOS_CATEGORIAS.map(cat => {
        const totalCat = gastosFiltrados.filter(g => g.categoriaId === cat.id).reduce((a, b) => a + b.monto, 0);
        const porcentaje = sumGastos > 0 ? Math.round((totalCat / sumGastos) * 100) : 0;
        return { ...cat, total: totalCat, porcentaje };
      }).filter(c => c.total > 0).sort((a, b) => b.total - a.total);

      const totalFiadosCalle = clientes.reduce((a, b) => a + (b.saldoFiado || 0), 0);
      const progresoMeta = config.metaDiaria > 0 ? Math.min(100, Math.round((sumVentas / config.metaDiaria) * 100)) : 0;

      const totalSeleccionadoComensales = modalCobrarActiva && modalCobrarActiva.subcuentas
        ? comensalesSeleccionadosCobro.reduce((sum, nom) => sum + (modalCobrarActiva.subcuentas[nom]?.monto || 0), 0)
        : 0;

      return (
        <div className="w-full max-w-6xl mx-auto min-h-screen flex flex-col justify-between p-3 sm:p-5 pb-28">
          
          <header className="liquid-glass rounded-3xl p-3.5 sm:px-5 mb-3 flex items-center justify-between gap-2">
            <div className="flex items-center gap-3 min-w-0">
              {config.logo ? (
                <img src={config.logo} alt="Logo" className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl object-cover border border-white shrink-0" />
              ) : (
                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-neutral-900 text-white flex flex-col items-center justify-center shrink-0">
                  <span className="font-black text-xs tracking-tighter leading-none">2FQ</span>
                </div>
              )}
              <div className="truncate">
                <div className="flex items-center gap-1.5">
                  <h1 className="font-black text-sm sm:text-base text-neutral-900 leading-tight truncate">{config.negocio}</h1>
                  <span className="px-1.5 py-0.5 rounded-md bg-neutral-900 text-white font-black text-[9px] tracking-tight shrink-0">2FQ</span>
                </div>
                <p className="text-[11px] font-semibold text-neutral-500 truncate">
                  {vista === 'pos' ? (
                    `${ordenEditando ? `Editando ${formatearNumeroOrden(ordenEditando.numero)}` : `Orden ${formatearNumeroOrden(contadorOrden)}`} • ${
                      nombreCliente.trim() ? nombreCliente.trim() : (tipoServicio === 'mesa' ? 'Comer aquí' : tipoServicio === 'llevar' ? 'Para llevar' : 'Delivery')
                    }`
                  ) : `${config.horario} • Too Fast & Quick`}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              {vista === 'pos' && (
                <>
                  <button
                    onClick={() => setModalServicio(true)}
                    className="liquid-glass-dark text-white px-3.5 py-2 rounded-full text-xs font-bold active:scale-95 transition whitespace-nowrap"
                  >
                    {etiquetaServicioCorto()} ▾
                  </button>
                  <button
                    onClick={cancelarEdicionOrdenActiva}
                    className="liquid-pill px-3 py-2 rounded-full text-xs font-bold text-neutral-700 active:scale-95 transition"
                  >
                    ✕ Salir
                  </button>
                </>
              )}

              <button
                onClick={abrirConfiguracion}
                title="Ajustes del Negocio"
                className="w-9 h-9 rounded-full liquid-pill flex items-center justify-center text-sm active:scale-90 transition shrink-0"
              >
                ⚙️
              </button>
            </div>
          </header>

          {vista === 'activas' && (

                  <button
                    onClick={() => setModoCobroActiva('comensales')}
                    className={`py-2 rounded-xl transition ${modoCobroActiva === 'comensales' ? 'liquid-glass-dark text-white' : 'text-neutral-600'}`}
                  >
                    Por Comensal
                  </button>
                  <button
                    onClick={() => setModoCobroActiva('iguales')}
                    className={`py-2 rounded-xl transition ${modoCobroActiva === 'iguales' ? 'liquid-glass-dark text-white' : 'text-neutral-600'}`}
                  >
                    Partes iguales
                  </button>
                </div>

                {modoCobroActiva === 'comensales' && (
                  <div className="bg-neutral-50 border border-neutral-200 rounded-2xl p-3 space-y-2">
                    <p className="text-[11px] font-bold text-neutral-600">Marca uno o une varios amigos para cobrar:</p>
                    <div className="space-y-1.5 max-h-40 overflow-y-auto">
                      {Object.entries(modalCobrarActiva.subcuentas || {}).map(([nom, sub]) => {
                        const marcado = comensalesSeleccionadosCobro.includes(nom);
                        return (
                          <button
                            key={nom}
                            type="button"
                            disabled={sub.pagada}
                            onClick={() => {
                              if (marcado) {
                                setComensalesSeleccionadosCobro(prev => prev.filter(n => n !== nom));
                              } else {
                                setComensalesSeleccionadosCobro(prev => [...prev, nom]);
                              }
                            }}
                            className={`w-full p-2.5 rounded-xl border flex items-center justify-between text-xs font-bold transition ${
                              sub.pagada
                                ? 'bg-emerald-50 border-emerald-200 text-emerald-800 opacity-70 cursor-not-allowed'
                                : marcado
                                ? 'bg-neutral-900 text-white border-neutral-900'
                                : 'bg-white border-neutral-200 text-neutral-800'
                            }`}
                          >
                            <span className="flex items-center gap-2">
                              <span>{sub.pagada ? '✓' : marcado ? '☑' : '☐'}</span>
                              <span>👤 {nom}</span>
                            </span>
                            <span className="font-mono">
                              {sub.pagada ? `Pagado ($${sub.monto.toFixed(2)})` : `$${sub.monto.toFixed(2)}`}
                            </span>
                          </button>
                        );
                      })}
                    </div>

                    <div className="pt-1 border-t border-neutral-200 flex justify-between items-center text-xs">
                      <span className="font-bold text-neutral-500">Total seleccionado ({comensalesSeleccionadosCobro.length}):</span>
                      <span className="font-mono text-lg font-black text-neutral-900">${totalSeleccionadoComensales.toFixed(2)}</span>
                    </div>
                  </div>
                )}

                {modoCobroActiva === 'iguales' && (
                  <div className="bg-neutral-50 border border-neutral-200 rounded-2xl p-3 text-center space-y-2">
                    <div className="flex items-center justify-center gap-4">
                      <button onClick={() => setPersonasDividirActiva(Math.max(2, personasDividirActiva - 1))} className="w-8 h-8 rounded-xl bg-white border font-bold">-</button>
                      <div>
                        <span className="text-2xl font-black font-mono">{personasDividirActiva}</span>
                        <span className="text-[10px] block uppercase font-bold text-neutral-500">Personas</span>
                      </div>
                      <button onClick={() => setPersonasDividirActiva(personasDividirActiva + 1)} className="w-8 h-8 rounded-xl bg-white border font-bold">+</button>
                    </div>
                    <p className="text-xs font-bold text-emerald-700 bg-emerald-50 py-1.5 rounded-xl">
                      Cada uno paga: <span className="font-mono text-base font-black">${((modalCobrarActiva.saldoPendiente > 0 ? modalCobrarActiva.saldoPendiente : modalCobrarActiva.monto) / personasDividirActiva).toFixed(2)}</span>
                    </p>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                  <button
                    disabled={modoCobroActiva === 'comensales' && totalSeleccionadoComensales <= 0}
                    onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'efectivo', modoCobroActiva === 'comensales')}
                    className="p-3 rounded-2xl bg-neutral-100 text-neutral-900 text-left disabled:opacity-40"
                  >
                    💵 Efectivo
                  </button>
                  <button
                    disabled={modoCobroActiva === 'comensales' && totalSeleccionadoComensales <= 0}
                    onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'wompi', modoCobroActiva === 'comensales')}
                    className="p-3 rounded-2xl bg-purple-100 text-purple-900 text-left disabled:opacity-40"
                  >
                    💳 Wompi / POS
                  </button>
                  <button
                    disabled={modoCobroActiva === 'comensales' && totalSeleccionadoComensales <= 0}
                    onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'transferencia', modoCobroActiva === 'comensales')}
                    className="p-3 rounded-2xl bg-blue-100 text-blue-900 text-left disabled:opacity-40"
                  >
                    📱 Transferencia
                  </button>
                  <button
                    disabled={modoCobroActiva === 'comensales' && totalSeleccionadoComensales <= 0}
                    onClick={() => cobrarOrdenActiva(modalCobrarActiva, 'fiado', modoCobroActiva === 'comensales')}
                    className="p-3 rounded-2xl bg-amber-100 text-amber-900 text-left disabled:opacity-40"
                  >
                    🤝 Queda Fiado
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => setModalVerQr(true)}
                  className="w-full py-2.5 bg-blue-600 text-white rounded-2xl text-xs font-bold shadow-sm active:scale-95 transition"
                >
                  📲 Ver QR / Cuenta ({config.bancoNombre})
                </button>
              </div>
            </div>
          )}

          {modalVerQr && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-[999]">
              <div className="liquid-glass-solid rounded-[2rem] p-6 w-full max-w-xs text-center space-y-3 shadow-2xl relative">
                <button
                  onClick={() => setModalVerQr(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-neutral-100 flex items-center justify-center font-bold text-xs text-neutral-700"
                >
                  ✕
                </button>
                <p className="text-xs font-black uppercase tracking-wider text-blue-700 pt-1">{config.bancoNombre}</p>
                <h3 className="font-black text-base text-neutral-900">{config.negocio}</h3>
                
                {config.bancoCuenta && (
                  <div className="bg-blue-50 border border-blue-200 py-2 px-3 rounded-2xl">
                    <span className="text-[10px] uppercase font-bold text-blue-700 block">Número de Cuenta</span>
                    <span className="font-mono text-sm font-black text-neutral-900 select-all">{config.bancoCuenta}</span>
                  </div>
                )}

                {config.bancoQr ? (
                  <div className="bg-white p-3 rounded-3xl border border-neutral-200 shadow-inner">
                    <img src={config.bancoQr} alt="QR Banco" className="w-52 h-52 mx-auto rounded-xl object-contain" />
                  </div>
                ) : (
                  <div className="p-5 bg-neutral-100 rounded-2xl text-xs text-neutral-600">
                    No has subido una captura de QR aún. Puedes agregarla en el botón ⚙️ de arriba.
                  </div>
                )}

                <button
                  onClick={() => setModalVerQr(false)}
                  className="w-full py-3.5 liquid-glass-dark text-white rounded-2xl font-bold text-xs"
                >
                  Listo, volver a la orden
                </button>
              </div>
            </div>
          )}

          <nav className="fixed bottom-3 left-3 right-3 max-w-lg mx-auto liquid-glass rounded-3xl p-2 flex justify-around text-xs z-30 shadow-lg">
            <button onClick={() => setVista('activas')} className={`relative flex flex-col items-center py-1 px-3 rounded-2xl transition ${vista === 'activas' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              {ordenesActivas.length > 0 && (
                <span className="absolute -top-1 right-1.5 bg-rose-500 text-white text-[9px] font-black px-1.5 rounded-full">
                  {ordenesActivas.length}
                </span>
              )}
              <span className="text-base">🔥</span>
              <span className="text-[10px]">Activas</span>
            </button>
            <button onClick={iniciarNuevaOrden} className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${vista === 'pos' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">🫓</span>
              <span className="text-[10px]">Ordenar</span>
            </button>
            <button onClick={() => setVista('gastos')} className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${vista === 'gastos' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">🧾</span>
              <span className="text-[10px]">Gastos</span>
            </button>
            <button onClick={() => setVista('clientes')} className={`relative flex flex-col items-center py-1 px-3 rounded-2xl transition ${vista === 'clientes' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              {totalFiadosCalle > 0 && <span className="absolute top-1 right-2.5 w-2 h-2 rounded-full bg-amber-500" />}
              <span className="text-base">👥</span>
              <span className="text-[10px]">Clientes</span>
            </button>
            <button onClick={() => setVista('resumen')} className={`flex flex-col items-center py-1 px-3 rounded-2xl transition ${vista === 'resumen' ? 'bg-neutral-900 text-white font-bold' : 'text-neutral-600'}`}>
              <span className="text-base">📊</span>
              <span className="text-[10px]">Resumen</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
